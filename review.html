<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review card — Mariano Electric</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .printc { max-width: 5.05in; margin: 1.1rem auto; background: #c9a36a; border: 8px solid #a9844e; padding: 1rem; }
    .printc h1 { font-family: "Bowlby One SC", Impact, sans-serif; font-size: 1.5rem; margin: 0 0 0.3rem; }
    .printc img { width: 200px; height: 200px; display: block; margin: 0.6rem auto; background: #fff; }
    .actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .actions button, .actions a { background: #8a1f18; color: #f3e2c0; border: 0; padding: 0.45rem 0.65rem; text-decoration: none; cursor: pointer; font-family: Inconsolata, ui-monospace, monospace; }
    @media print { .lang, .actions { display: none !important; } body { background: #fff; } }
  </style>
</head>
<body>
  <article class="printc">
    <nav class="lang" aria-label="Language">
      <button type="button" data-set="en" aria-pressed="true">EN</button>
      <button type="button" data-set="es" aria-pressed="false">ES</button>
    </nav>
    <h1>Mariano Electric</h1>
    <p><a class="plain" href="tel:+18588768131">(858) 876-8131</a> · San Diego, CA</p>
    <img src="review-qr.svg" width="200" height="200" alt="QR code to find Mariano Electric on Google">
    <p data-en="Scan to find us on Google and leave a review." data-es="Escanee para encontrarnos en Google y dejar una reseña.">Scan to find us on Google and leave a review.</p>
    <div class="actions">
      <button type="button" id="print-card" data-en="Print this card" data-es="Imprimir esta tarjeta">Print this card</button>
      <a href="index.html" data-en="Back to the sleeve" data-es="Volver al sobre">Back to the sleeve</a>
    </div>
  </article>
  <script src="script.js"></script>
</body>
</html>
